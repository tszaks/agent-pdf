<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
{{THEME_VARS}}
<style>
:root {
  --color-primary: #111827;
  --color-accent: #6366F1;
  --color-accent-light: #EEF2FF;
  --color-text: #374151;
  --color-muted: #9CA3AF;
  --color-border: #E5E7EB;
  --color-surface: #F9FAFB;
  --font-heading: 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
}

@page { size: {{PAGE_SIZE}}; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  font-size: 10pt;
  line-height: 1.7;
  color: var(--color-text);
  background: white;
}

/* ── Cover ── */
.cover {
  width: 100%;
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  page-break-after: always;
  position: relative;
  overflow: hidden;
}

.cover-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 0.6in 0.8in 0;
}

.cover-badge {
  font-family: var(--font-heading);
  font-size: 7.5pt;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--color-accent);
  background: var(--color-accent-light);
  padding: 5px 12px;
  border-radius: 100px;
}

.cover-logo img { max-height: 36px; }

.cover-hero {
  padding: 0 0.8in;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.cover-accent-line {
  width: 4px;
  height: 64px;
  background: linear-gradient(to bottom, var(--color-accent), transparent);
  border-radius: 2px;
  margin-bottom: 28px;
}

.cover-title {
  font-family: var(--font-heading);
  font-size: 40pt;
  font-weight: 800;
  color: var(--color-primary);
  line-height: 1.1;
  letter-spacing: -1.5px;
  margin-bottom: 20px;
  max-width: 5.5in;
}

.cover-tagline {
  font-size: 13pt;
  font-weight: 300;
  color: var(--color-muted);
  max-width: 4.5in;
  line-height: 1.5;
  margin-bottom: 36px;
}

.cover-for-by {
  display: flex;
  gap: 40px;
}

.cover-party { display: flex; flex-direction: column; gap: 4px; }
.cover-party-label {
  font-size: 7pt;
  font-weight: 600;
  color: var(--color-accent);
  text-transform: uppercase;
  letter-spacing: 1.5px;
}
.cover-party-name {
  font-size: 11pt;
  font-weight: 600;
  color: var(--color-primary);
}

.cover-bottom {
  border-top: 1px solid var(--color-border);
  padding: 20px 0.8in;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cover-date {
  font-size: 8.5pt;
  color: var(--color-muted);
}

.cover-bar {
  height: 6px;
  background: linear-gradient(90deg, var(--color-accent) 0%, #818CF8 50%, #C7D2FE 100%);
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
}

/* ── Content layout ── */
.content {
  padding: 0.55in 0.8in;
}

/* ── Section with left accent bar ── */
h2 {
  font-family: var(--font-heading);
  font-size: 18pt;
  font-weight: 700;
  color: var(--color-primary);
  margin: 40px 0 16px;
  padding-left: 16px;
  border-left: 3px solid var(--color-accent);
  line-height: 1.25;
  page-break-after: avoid;
}

h1 {
  font-family: var(--font-heading);
  font-size: 22pt;
  font-weight: 700;
  color: var(--color-primary);
  margin: 32px 0 12px;
  page-break-after: avoid;
}

h3 {
  font-family: var(--font-heading);
  font-size: 12pt;
  font-weight: 600;
  color: var(--color-primary);
  margin: 20px 0 8px;
  page-break-after: avoid;
}

p { margin-bottom: 12px; }
strong { font-weight: 600; color: var(--color-primary); }

/* ── Highlight boxes ── */
blockquote {
  background: var(--color-accent-light);
  border: none;
  border-left: 4px solid var(--color-accent);
  padding: 16px 20px;
  margin: 20px 0;
  border-radius: 0 8px 8px 0;
  font-weight: 500;
  color: var(--color-primary);
}

/* ── Feature list ── */
ul { margin: 0 0 14px 0; padding: 0; list-style: none; }
ul li {
  padding: 6px 0 6px 24px;
  position: relative;
  border-bottom: 1px solid var(--color-border);
}
ul li:last-child { border-bottom: none; }
ul li::before {
  content: '→';
  position: absolute;
  left: 0;
  color: var(--color-accent);
  font-weight: 600;
}

ol { margin: 0 0 14px 20px; }
ol li { margin-bottom: 6px; }
ol li::marker { color: var(--color-accent); font-weight: 600; }

/* ── Tables ── */
table {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-size: 9.5pt;
  page-break-inside: avoid;
}

th {
  background: var(--color-primary);
  color: white;
  font-family: var(--font-heading);
  font-size: 8pt;
  font-weight: 600;
  letter-spacing: 0.3px;
  padding: 10px 14px;
  text-align: left;
}

td { padding: 10px 14px; border-bottom: 1px solid var(--color-border); }
tr:hover td { background: var(--color-surface); }

/* ── Code ── */
code {
  font-family: monospace;
  font-size: 9pt;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  padding: 1px 5px;
  border-radius: 4px;
}

pre {
  background: var(--color-primary);
  color: #e2e8f0;
  padding: 16px 20px;
  border-radius: 8px;
  margin: 16px 0;
  page-break-inside: avoid;
}

pre code { background: none; border: none; color: inherit; padding: 0; }

/* ── CTA / pricing box ── */
.highlight-box {
  background: linear-gradient(135deg, var(--color-accent) 0%, #818CF8 100%);
  color: white;
  padding: 28px 32px;
  border-radius: 12px;
  margin: 24px 0;
  page-break-inside: avoid;
}

/* ── Watermark ── */
.watermark {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-35deg);
  font-family: var(--font-heading);
  font-size: 80pt;
  font-weight: 800;
  color: rgba(0,0,0,0.03);
  white-space: nowrap;
  pointer-events: none;
  letter-spacing: 8px;
}
</style>
</head>
<body>
{{WATERMARK}}

<div class="cover">
  <div class="cover-top">
    <div class="cover-logo">{{LOGO_HTML}}</div>
    <div class="cover-badge">Proposal</div>
  </div>
  <div class="cover-hero">
    <div class="cover-accent-line"></div>
    <h1 class="cover-title">{{TITLE}}</h1>
    <p class="cover-tagline">{{TAGLINE}}</p>
    <div class="cover-for-by">
      {{PREPARED_FOR}}
      {{PREPARED_BY}}
    </div>
  </div>
  <div class="cover-bottom">
    <div class="cover-date">{{DATE}}</div>
    <div></div>
  </div>
  <div class="cover-bar"></div>
</div>

<div class="content">
  {{BODY}}
</div>

</body>
</html>
