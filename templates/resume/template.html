<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
{{THEME_VARS}}
<style>
:root {
  --color-primary: #111;
  --color-accent: #111;
  --color-text: #1a1a1a;
  --color-muted: #555;
  --color-rule: #222;
  --font: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

@page {
  size: {{PAGE_SIZE}};
  margin: 0.55in 0.65in 0.55in 0.65in;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  font-size: 9.5pt;
  line-height: 1.45;
  color: var(--color-text);
  background: white;
}

/* ── Header: name + contact ── */
.resume-header {
  text-align: center;
  margin-bottom: 18pt;
  padding-bottom: 0;
}

.resume-name {
  font-size: 22pt;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--color-primary);
  margin-bottom: 4pt;
  line-height: 1.1;
}

.resume-contact {
  font-size: 8.5pt;
  color: var(--color-muted);
  letter-spacing: 0.2px;
}

.resume-contact a { color: var(--color-muted); text-decoration: none; }

/* ── Logo (optional company logo) ── */
.logo { max-height: 32px; margin-bottom: 6pt; display: block; margin-left: auto; margin-right: auto; }

/* ── Section headers ── */
h2 {
  font-size: 8pt;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.8px;
  color: var(--color-primary);
  border-bottom: 1pt solid var(--color-rule);
  padding-bottom: 2pt;
  margin: 12pt 0 6pt;
  page-break-after: avoid;
}

/* ── h3: Job title / Degree ── */
h3 {
  font-size: 10pt;
  font-weight: 600;
  color: var(--color-primary);
  margin: 6pt 0 0;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  page-break-after: avoid;
}

/* ── h4: Company / Institution ── */
h4 {
  font-size: 9pt;
  font-weight: 400;
  color: var(--color-muted);
  font-style: italic;
  margin: 1pt 0 3pt;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

/* ── Body text ── */
p { margin-bottom: 4pt; font-size: 9.5pt; }

/* ── Bullet lists (job responsibilities) ── */
ul {
  margin: 3pt 0 6pt 14pt;
  padding: 0;
}

ul li {
  margin-bottom: 2pt;
  font-size: 9.5pt;
  line-height: 1.4;
}

ul li::marker { color: var(--color-muted); }

/* ── Inline tags (skills, tech stack) ── */
.tags { display: flex; flex-wrap: wrap; gap: 4pt; margin-top: 4pt; }
.tag {
  font-size: 8pt;
  font-weight: 500;
  padding: 2pt 7pt;
  border: 0.75pt solid #ccc;
  border-radius: 2pt;
  color: var(--color-muted);
}

/* ── Strong ── */
strong { font-weight: 600; color: var(--color-primary); }
em { font-style: italic; color: var(--color-muted); }

/* ── Horizontal rule (section divider) ── */
hr { border: none; border-top: 0.5pt solid #ddd; margin: 8pt 0; }

/* ── Tables (optional: skills matrix, coursework) ── */
table {
  width: 100%;
  border-collapse: collapse;
  margin: 4pt 0 8pt;
  font-size: 9pt;
}

td { padding: 2pt 8pt 2pt 0; vertical-align: top; }
td:first-child { font-weight: 600; white-space: nowrap; width: 1.2in; color: var(--color-primary); }

/* ── Links ── */
a { color: var(--color-text); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Watermark ── */
.watermark {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-35deg);
  font-size: 72pt;
  font-weight: 700;
  color: rgba(0,0,0,0.04);
  white-space: nowrap;
  pointer-events: none;
  letter-spacing: 8px;
}

/* ── Print-safe: no color backgrounds ── */
@media print {
  .watermark { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
{{WATERMARK}}

<div class="resume-header">
  {{LOGO_HTML}}
  <h1 class="resume-name">{{TITLE}}</h1>
  <div class="resume-contact">{{CONTACT_LINE}}</div>
</div>

{{BODY}}

</body>
</html>
